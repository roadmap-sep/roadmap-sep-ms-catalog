name: Test, CheckStyle & Coverage (Gradle)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Validar Conventional Commits
      - name: Validate Conventional Commits
        uses: webiny/action-conventional-commits@v1.3.0

      # 3. Configurar JDK 25 (Eclipse Temurin)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # 4. Dar permisos de ejecución a Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Cache de Gradle (dependencias y archivos de compilación)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Checkstyle (estilo de código)
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      # 7. Compilar, ejecutar tests, cobertura y verificación de umbrales
      - name: Build, Test and Coverage Verification
        run: ./gradlew build check --no-daemon

      # 8. Subir el reporte de cobertura de JaCoCo
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/